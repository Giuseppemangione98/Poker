# Checks that the app is reachable through public CDN mirrors of this repo.
name: midterm-check
on:
  push:
    branches: [claude/upbeat-gates-8xs1mk]
    paths: ['.github/workflows/midterm-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for base in "https://rawcdn.githack.com/Giuseppemangione98/Poker/ddda7bc83eb0f400d786f086a6f389ad25fcb97a/docs" "https://cdn.statically.io/gh/Giuseppemangione98/Poker/ddda7bc83eb0f400d786f086a6f389ad25fcb97a/docs"; do
            for f in index.html app.js states.js manifest.webmanifest sw.js icons/icon-192.png; do
              curl -sS -o /dev/null -w "$base/$f %{http_code} %{content_type}\n" "$base/$f" || true
            done
            curl -sSI "$base/sw.js" | grep -iE "^(access-control|service-worker|content-type|cache-control)" || true
          done
