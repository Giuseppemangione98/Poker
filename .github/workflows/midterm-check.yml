# Checks that the app is reachable through the githack CDN at this commit.
name: midterm-check
on:
  push:
    branches: [claude/upbeat-gates-8xs1mk]
    paths: ['.github/workflows/midterm-check.yml', 'docs/*.html', 'docs/*.js', 'docs/*.json', 'docs/*.css']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          base="https://rawcdn.githack.com/Giuseppemangione98/Poker/${{ github.sha }}/docs"
          echo "APP URL: $base/index.html"
          for f in index.html app.js nyt.js config.js states.js style.css manifest.json sw.js; do
            curl -sS -o /dev/null -w "$f %{http_code} %{content_type}\n" "$base/$f" || true
          done
